<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garde – all your recipes, one place</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Serif&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e5532d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div id="banner"></div>
<header class="nav glass" id="nav"></header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
addEventListener("error", e => { const a = document.getElementById("app"); if (a && !a.children.length) a.innerHTML = '<div style="max-width:560px;margin:10vh auto;text-align:center;line-height:1.6"><h2>Garde couldn\'t start</h2><p style="color:#6b645c">' + String(e.message || "A file failed to load").replace(/</g, "&lt;") + '</p><p style="color:#6b645c">Press F12 and open the Console for details. Make sure every file from the download was uploaded next to index.html.</p></div>'; });
</script>
<script>
// If the app can't load, find out exactly which files are missing.
async function gardeDiag() {
  const need = ["app.js", "tpl.js", "support.js", "sous.js", "cook.js", "extras.js", "photos.js", "extract.js", "library.js", "scale.js", "firebase-config.js"];
  const missing = (await Promise.all(need.map(f => fetch(f, { cache: "no-cache" }).then(r => r.ok ? null : f).catch(() => f)))).filter(Boolean);
  const box = document.createElement("div"); box.style.cssText = "max-width:560px;margin:10vh auto;text-align:center;line-height:1.6";
  const h = document.createElement("h2"), p = document.createElement("p"); p.style.color = "#6b645c";
  if (missing.length) { h.textContent = "Some files are missing"; p.textContent = "Upload these next to index.html, then refresh: " + missing.join(", "); }
  else { h.textContent = "Garde couldn't start"; p.textContent = "All the files were found, but one didn't load. Press Ctrl+Shift+R to refresh, then open check.html on your site."; }
  box.append(h, p); const a = document.getElementById("app"); a.innerHTML = ""; a.append(box);
}
</script>
<script type="module" src="app.js" onerror="gardeDiag()"></script>
</body>
</html>
