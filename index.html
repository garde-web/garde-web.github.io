<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garde – all your recipes, one place</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Caveat:wght@600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav glass" id="nav"></header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
addEventListener("error", e => { const a = document.getElementById("app"); if (a && !a.children.length) a.innerHTML = '<div style="max-width:560px;margin:10vh auto;text-align:center;line-height:1.6"><h2>Garde couldn\'t start</h2><p style="color:#6b645c">' + String(e.message || "A file failed to load").replace(/</g, "&lt;") + '</p><p style="color:#6b645c">Press F12 and open the Console for details.</p></div>'; });
</script>
<script type="module" src="app.js" onerror="document.getElementById('app').textContent='A Garde file failed to load. Check that every file was uploaded to the same folder.'"></script>
</body>
</html>
