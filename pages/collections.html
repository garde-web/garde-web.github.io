<h1 class="pg">Collections</h1><p class="lead">Your recipes, grouped by tag.</p>
{{#if none}}<div class="empty glass"><h3>No collections yet</h3>Add tags like "dinner" or "baking" to your recipes and they'll group here.<br><a class="btn main" href="#/add">Add recipe</a></div>
{{else}}{{#each groups}}<div class="sect"><h3>{{name}} <small class="meta">{{count}}</small></h3><div class="grid">{{#each recipes}}<a class="rc glass" href="#/recipe/{{id}}"><div class="body"><h3>{{title}}</h3><small>{{time}}</small></div></a>{{/each}}</div></div>{{/each}}{{/if}}
