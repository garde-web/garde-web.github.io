<h1 class="pg">Support</h1><p class="lead">Tell us what's going on and our team will reply in your ticket. Something not working for everyone? Check the <a href="#/status">status page</a> first.{{#if reserve}} As a Reserve member, your tickets go to the front of the line.{{/if}}</p>
<div class="detail"><div class="panel glass"><h3>New ticket</h3>
  <label for="cat">Topic</label><select id="cat">{{#each cats}}<option>{{.}}</option>{{/each}}</select>
  <label for="sub">Subject</label><input id="sub" maxlength="120" autocomplete="off"><div id="sg"></div>
  <label for="msg">Message</label><textarea id="msg" maxlength="4000"></textarea>
  <div class="row" style="margin-top:24px"><button class="btn main" id="send">Send ticket</button></div></div>
  <div><h3 style="margin-bottom:16px">Your tickets</h3><div id="mine"><p class="meta">Loading…</p></div></div></div>

<template id="signin"><div class="center glass"><h2>Support</h2><p>Sign in to open a ticket and follow replies from our team.</p><a class="btn main" href="#/login">Sign in</a></div></template>
<template id="suggest">{{#if items}}<p class="meta" style="margin-top:14px">These might already answer it:</p>{{#each items}}<details class="glass sug"><summary>{{q}}</summary><p>{{a}}</p></details>{{/each}}{{/if}}</template>
<template id="mine">{{#if list}}{{> shared#rows}}{{else}}<div class="empty glass"><h3>No tickets yet</h3>When you open one, it shows up here.</div>{{/if}}</template>
<template id="mine-error"><p class="meta">Couldn't load your tickets.</p></template>
