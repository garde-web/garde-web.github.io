<template id="locked"><div class="center glass"><span class="badge">GARDE RESERVE</span><h2 style="margin-top:18px">Meet Sous</h2><p>Your weekly meal planner. Pick recipes from the library or your own collection, and Garde puts every ingredient in your Pantry.</p><a class="btn main" href="#/reserve">See Garde Reserve</a></div></template>
<template id="loading"><p class="meta">Loading your week…</p></template>
<template id="error"><div class="empty glass"><h3>Couldn't load Sous</h3>Check your connection and refresh.</div></template>

<template id="shell"><h1 class="pg">Sous</h1><p class="lead">Plan your week. Every recipe you add is saved to your recipes and its ingredients go straight into your Pantry.</p>
<div class="bar"><a class="chip" href="#/sous" data-tab="plan" aria-pressed="{{planOn}}">Plan</a><a class="chip" href="#/sous" data-tab="lib" aria-pressed="{{libOn}}">Library</a>
  <span class="meta" style="margin-left:auto">{{summary}}</span><a class="btn" href="#/pantry">Open Pantry</a></div>
<div id="body"></div></template>

<template id="plan"><div class="bar" style="margin-top:0"><button class="btn" id="pw" aria-label="Previous week">‹</button><b>{{label}}</b><button class="btn" id="nw" aria-label="Next week">›</button><button class="btn" id="tw">This week</button><span style="margin-left:auto"></span><button class="btn" id="cp">Copy last week</button><button class="btn danger" id="cl">Clear week</button></div>
<div class="week">{{#each days}}<div class="glass day{{#if today}} today{{/if}}"><div class="dh"><b>{{name}}</b><small>{{date}}</small></div>
{{#each meals}}<div class="meal"><span class="aisle">{{label}}</span>{{#each entries}}<div class="pe"><a href="#/recipe/{{rid}}">{{title}}</a><span class="step" data-k="{{key}}" data-n="{{n}}"><button data-d="-1" aria-label="Fewer servings">−</button><b>{{servings}}</b><button data-d="1" aria-label="More servings">+</button><button data-x aria-label="Remove">×</button></span></div>{{/each}}<button class="addb" data-add="{{key}}">+ Add</button></div>{{/each}}</div>{{/each}}</div></template>

<template id="library"><div class="panel glass" style="padding:20px 24px"><div class="row" style="gap:12px"><b>Planning for</b><select id="sd" style="width:auto" aria-label="Day">{{#each days}}<option value="{{i}}"{{#if on}} selected{{/if}}>{{name}}</option>{{/each}}</select><select id="sm" style="width:auto" aria-label="Meal">{{#each meals}}<option value="{{v}}"{{#if on}} selected{{/if}}>{{label}}</option>{{/each}}</select><span class="meta">week of {{label}}</span><button class="btn" id="sp" style="margin-left:auto">Surprise me</button></div></div>
<div class="bar"><input id="sq" type="search" placeholder="Search by recipe, ingredient or tag" aria-label="Search recipes" value="{{q}}"><select id="st" style="width:auto" aria-label="Time">{{#each times}}<option value="{{v}}"{{#if on}} selected{{/if}}>{{label}}</option>{{/each}}</select>
  <button class="chip" data-s="library" aria-pressed="{{srcLibrary}}">Garde library</button><button class="chip" data-s="mine" aria-pressed="{{srcMine}}">My recipes</button></div>
<div class="bar" style="margin-top:0">{{#each tags}}<button class="chip" data-t="{{t}}" aria-pressed="{{on}}">{{t}}</button>{{/each}}</div>
<div class="grid" id="cards"></div></template>

<template id="cards">{{#each cards}}<div class="glass panel sc"><small class="meta">{{info}}</small><h3>{{title}}</h3>
<div>{{#each tags}}<span class="pill">{{.}}</span>{{/each}}</div>
<details><summary class="meta">{{count}} ingredients</summary><ul>{{#each ings}}<li>{{.}}</li>{{/each}}</ul></details>
<button class="btn main" data-i="{{i}}">{{btn}}</button></div>{{else}}<div class="empty glass" style="grid-column:1/-1"><h3>No recipes match</h3>Try a different search or filter.</div>{{/each}}</template>
